server:
  port: "${IS_SERVICE_PORT}"

spring:
  main:
    banner-mode: "off"
  jpa:
    generate-ddl: true
    hibernate.ddl-auto: "update"
    database-platform: "org.hibernate.dialect.PostgreSQLDialect"
    properties:
      javax:
        persistence:
          validation:
            mode: "auto"
    show-sql: true
  mvc:
    pathmatch:
      matching-strategy: "ant_path_matcher"
